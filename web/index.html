<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Gallery</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/labset-frosted-dark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Apple touch icon (home screen pin) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Game Gallery" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Web app manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (function () {
        var t = localStorage.getItem("game-gallery-theme") || "burgundy";
        var m = localStorage.getItem("game-gallery-mode") || "system";
        document.documentElement.setAttribute("data-theme", t);
        if (
          m === "dark" ||
          (m === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
